name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  WASM_SDK: swift-6.4.0-RELEASE_wasm
  WASM_SDK_URL: https://download.swift.org/swift-6.4.0-release/wasm-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_wasm.artifactbundle.tar.gz
  WASM_SDK_SHA256: f07b7be3c586d92d7a07051fc6d303b87ebea67eadc40640ba59d5a8b79aa86d

jobs:
  core:
    name: Build, test, wasm32 and the size budget
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages for the swift.org toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils git gnupg2 libc6-dev libcurl4-openssl-dev libedit2 libgcc-13-dev libpython3-dev libsqlite3-0 libstdc++-13-dev libxml2-dev libncurses-dev libz3-dev pkg-config tzdata unzip zlib1g-dev

      - name: Cache the toolchain and the WebAssembly SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/swiftly
            ~/.swiftpm/swift-sdks
          key: swiftly-${{ runner.os }}-${{ hashFiles('.swift-version') }}-wasm-v1

      - name: Install swiftly and the pinned toolchain
        run: |
          set -eu
          if [ ! -x "$HOME/.local/share/swiftly/bin/swiftly" ]; then
            curl -fsSL -O "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz"
            tar zxf "swiftly-$(uname -m).tar.gz"
            ./swiftly init --quiet-shell-followup --assume-yes --skip-install --no-modify-profile
          fi
          . "$HOME/.local/share/swiftly/env.sh"
          swiftly install
          echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"

      - name: Install the WebAssembly SDK
        run: |
          set -eu
          if ! swift sdk list | grep -q "$WASM_SDK"; then
            curl -fsSL -o wasm-sdk.tar.gz "$WASM_SDK_URL"
            echo "$WASM_SDK_SHA256  wasm-sdk.tar.gz" | sha256sum -c -
            swift sdk install wasm-sdk.tar.gz
          fi

      - name: Build
        run: swift build

      - name: Test on the host
        run: swift test

      # The command `README.md` gives, with the SDK named once in `WASM_SDK` above.
      # The flag skips nothing here; on macOS it keeps a run with `--filter` away from Xcode's XCTest helper (#76).
      - name: Test on wasm32 under WasmKit
        run: swift test --swift-sdk "$WASM_SDK" --disable-xctest

      - name: Run the size probe on the host
        run: swift run wasm-size-probe

      - name: Release wasm build and size budget
        run: scripts/wasm-size.sh

  apple:
    name: iOS and watchOS, the app and Xcode's toolchain
    runs-on: xcode-27
    # One Xcode for every step, the one the app is built with: its SDKs for the compile checks and its toolchain
    # for the builds at the end.
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      # First, because every step below uses this Xcode and a preview image can repoint it to a build with another
      # Swift: such a change fails here, by name, before the toolchain install and the compile checks are paid for.
      - name: Xcode's toolchain is the pinned version
        run: |
          set -eu
          PIN=$(cat .swift-version)
          VERSION=$(/usr/bin/swift --version)
          echo "$VERSION"
          case "$VERSION" in
            *"swiftlang-$PIN."*)
              ;;
            *)
              echo "Xcode's toolchain is not Swift $PIN, which .swift-version pins: its version above has no swiftlang-$PIN."
              exit 1
              ;;
          esac

      - name: Cache the toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftly
            ~/Library/Developer/Toolchains
          key: swiftly-${{ runner.os }}-${{ hashFiles('.swift-version') }}-v1

      - name: Install swiftly and the pinned toolchain
        run: |
          set -eu
          if [ ! -x "$HOME/.swiftly/bin/swiftly" ]; then
            curl -fsSL -O https://download.swift.org/swiftly/darwin/swiftly.pkg
            installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
            "$HOME/.swiftly/bin/swiftly" init --quiet-shell-followup --assume-yes --skip-install --no-modify-profile
          fi
          . "$HOME/.swiftly/env.sh"
          swiftly install
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"

      - name: Compile the core for iOS
        run: swift build --target TodoCore --triple arm64-apple-ios17.0 --sdk "$(xcrun --sdk iphoneos --show-sdk-path)"

      - name: Compile the core for watchOS
        run: swift build --target TodoCore --triple arm64_32-apple-watchos10.0 --sdk "$(xcrun --sdk watchos --show-sdk-path)"

      # The library the Apple apps import, compiled with the pinned toolchain where no build below reaches it: for
      # watchOS, which has no app yet, and for the iOS device, since the iPhone app is built at the end for the
      # simulator, with Xcode's toolchain (ADR-0008).
      - name: Compile the Apple UI library for iOS
        working-directory: Apps/Apple
        run: swift build --target TodoAppleUI --triple arm64-apple-ios17.0 --sdk "$(xcrun --sdk iphoneos --show-sdk-path)"

      - name: Compile the Apple UI library for watchOS
        working-directory: Apps/Apple
        run: swift build --target TodoAppleUI --triple arm64_32-apple-watchos10.0 --sdk "$(xcrun --sdk watchos --show-sdk-path)"

      - name: Build the Apple package
        working-directory: Apps/Apple
        run: swift build

      - name: Test the Apple package
        working-directory: Apps/Apple
        run: swift test

      # Apple accepts store builds from Xcode's toolchain, so both packages keep building with it, outside the
      # pinned toolchain's `.build`; with the first step, these builds are what shows that from Xcode 27 on the
      # pinned toolchain and Xcode's are one version (ADR-0008).
      - name: Build the root package with Xcode's toolchain
        run: /usr/bin/swift build --scratch-path "$RUNNER_TEMP/xcode-root"

      - name: Build the Apple package with Xcode's toolchain
        working-directory: Apps/Apple
        run: /usr/bin/swift build --scratch-path "$RUNNER_TEMP/xcode-apple"

      # The command `README.md` gives, with the derived data under `$RUNNER_TEMP`, outside the checkout, as the scratch
      # paths above: the one step that builds the Xcode project, which the Apple package's tests decode and do not
      # build. The version first, so that the log names the Xcode that built.
      - name: Build the iPhone app for the simulator
        run: |
          set -eu
          xcodebuild -version
          xcodebuild -project Apps/Apple/Todo.xcodeproj -scheme Todo -destination 'generic/platform=iOS Simulator' -configuration Debug -derivedDataPath "$RUNNER_TEMP/xcode-ios" CODE_SIGNING_ALLOWED=NO build
